# How an existing unit (original inventory) is compared with an incoming row.
#
# Every criterion counts equally: type, colour, size, location and material. The score is the
# share of the criteria that could be compared and agree. A criterion that cannot be compared
# for a pair (e.g. the description states no size or no material) is left out.
#
# Only a 100% match is paired automatically; anything less is left for manual review.
# The Serial No. is random and carries no date, so there is no year criterion.
auto_match_threshold: 100

# Words looked for (as whole words) in the Description; a word agrees with the incoming
# Material if the Material contains it or one of its synonyms.
material_keywords: [fabric, metal, leather, glass, mesh, oak, beech, wood, steel, chrome, textile]
material_synonyms:
  metal: [steel, chrome, aluminium]
  steel: [metal]
  chrome: [metal]
  fabric: [textile, upholstery]
  textile: [fabric]
  oak: [wood]
  beech: [wood]
  wood: [oak, beech, veneer]
